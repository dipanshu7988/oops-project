# Spring Application Configuration
spring.application.name=smart-queue-manager
server.port=8080

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:smartqueuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Business Logic Configuration
smartqueue.default-service-time-minutes=3
smartqueue.admin-password=admin123
